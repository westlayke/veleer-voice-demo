name: Patient Pat's calls, combined again
# Re-runs the combined report of an earlier "Patient Pat's calls" run from its saved per-machine results, with today's combine.js
# (so a report section added later can be read for old runs too). No conversations are run.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "The run id of the earlier Patient Pat run"
        required: true
permissions:
  actions: read
  contents: read
jobs:
  combine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: all, pattern: patient-pat-seed-*, run-id: "${{ inputs.run_id }}", github-token: "${{ github.token }}" }
      - name: Combine
        run: node tests/patience/combine.js all > combined.md && cat combined.md >> "$GITHUB_STEP_SUMMARY" && cat combined.md
