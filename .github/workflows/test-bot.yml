name: Test bot
# Taps through the demo and plays Ara's side with a pretend voice line (no xAI cost).
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 11 * * *"   # every morning, 7 am US Eastern
  workflow_dispatch:
jobs:
  # The preview's checks run as three shards on three machines at once (every third check each), about 2 minutes instead of 7.
  preview:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Test the preview (shard ${{ matrix.shard }})
        run: SHARD=${{ matrix.shard }} node tests/bot.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-screenshots-preview-${{ strategy.job-index }}
          path: tests/results/
  # The live page is tested with the checks as they were at its last go-live,
  # so checks for preview-only features don't fail against the live page.
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Test the live page
        run: |
          rm -rf tests-live && mkdir tests-live
          git archive "$(git log -1 --format=%H -- index.html)" tests | tar -x --strip-components=1 -C tests-live
          PAGE=index.html node tests-live/bot.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-screenshots-live
          path: tests-live/results/
