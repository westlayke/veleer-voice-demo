name: Deploy Worker
# Deploys worker/ to Cloudflare whenever it changes on main.
# Uses the CLOUDFLARE_API_TOKEN repository secret ("Edit Cloudflare Workers" token).
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          command: deploy
      - name: Check the Worker answers
        run: curl -sf https://veleer-voice.klaracey.workers.dev/log
