name: Patient Pat's calls
# The "are you there?" harness (tests/patience/): a stand-in officer with Jim's measured patience talks to a stand-in voice service
# through the app's own code, with dropped lines, stalls, dead spots, slow replies and soundless lines thrown in at Jim's rates.
# Every "Are you there?" is logged with its cause. No xAI calls, so a run costs nothing. Several machines run at once (matrix).
on:
  workflow_dispatch:
    inputs:
      conversations:
        description: "Conversations per machine (5 x 20 machines = 100, close to the 96 of the Oct 31 baseline)"
        default: "5"
      machines:
        description: "Machines at once (1-20); each gets its own seed. 20 is the default (Carverhill, Oct 31)"
        default: "20"
      rate:
        description: "Fault rate: 0 = none (baseline), 1 = Jim's calls, 2 = twice as rough"
        default: "1"
      jobs:
        description: "Conversations at once per machine"
        default: "6"
      max_minutes:
        description: "Minutes a conversation may take before it is cut off"
        default: "30"
      reconnect:
        description: "Who says where we were after a drop: ara (checked by the app) or app (scripted line)"
        default: "ara"
      drop_after_save:
        description: "Share of saves followed by a dropped line 2.5-5.5 s later (0 = none; 0.5 = half), the 10:36 AM call's case"
        default: "0"
      entity:
        description: "Entity Pat names, by spoken name (e.g. National C4); blank = a different one per conversation; old = the pre-Oct 31 answer"
        default: ""
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      seeds: ${{ steps.m.outputs.seeds }}
    steps:
      - id: m
        run: echo "seeds=$(node -e "const n=Math.max(1,Math.min(20,Number('${{ inputs.machines }}')||20));console.log(JSON.stringify(Array.from({length:n},(_,i)=>i+1)))")" >> "$GITHUB_OUTPUT"
  talk:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJson(needs.plan.outputs.seeds) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Talk
        env:
          CONVS: ${{ inputs.conversations }}
          RATE: ${{ inputs.rate }}
          JOBS: ${{ inputs.jobs }}
          SEED: ${{ matrix.seed }}
          MAX_MIN: ${{ inputs.max_minutes }}
          RECONNECT: ${{ inputs.reconnect }}
          DROP_AFTER_SAVE: ${{ inputs.drop_after_save }}
          ENTITY: ${{ inputs.entity }}
        run: MAX_MS=$(( ${MAX_MIN:-30} * 60000 )) node tests/patience/run.js
      - name: Report (in the log, since artifacts can't be fetched from the cloud session; the summary last, so a tail of the log has it)
        if: always()
        run: cat tests/patience/results/report-*.md && echo "===== SUMMARY (without the conversation logs)" && sed '/^<details>/,/^<\/details>/d' tests/patience/results/report-*.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patient-pat-seed-${{ matrix.seed }}
          path: tests/patience/results/
          retention-days: 30
  report:
    needs: talk
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: all, pattern: patient-pat-seed-* }
      - name: Combine
        run: node tests/patience/combine.js all > combined.md && cat combined.md >> "$GITHUB_STEP_SUMMARY" && cat combined.md
      - uses: actions/upload-artifact@v4
        with:
          name: patient-pat-combined
          path: combined.md
          retention-days: 30
