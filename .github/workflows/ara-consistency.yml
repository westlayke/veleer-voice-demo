name: Ara consistency run
# Real typed conversations through the preview build, scored against Ara's rules (tests/ara-consistency/), on one or more voice
# engines side by side (one job each, started together so there is no time-of-day difference between them).
# Costs real money (ARA_CONSISTENCY_KEY for xAI, OPENAI_CONSISTENCY_KEY, GEMINI_CONSISTENCY_KEY); each job stops itself at its share of the budget. Run by hand only.
# Each engine runs on several machines at once (20 by default, like Patient Pat; Carverhill, Oct 31): the budget and the conversations are split
# between them, each machine starts on a different flow, and a last job per engine combines them into one report.
on:
  workflow_dispatch:
    inputs:
      budget:
        description: "Most to spend per engine, in dollars (split between its machines)"
        default: "0.5"
      max_conversations:
        description: "Most conversations per engine, split between its machines (5 for a price probe)"
        default: "5"
      machines:
        description: "Machines per engine (1-20; never more than the conversations). 20 is the default (Carverhill, Oct 31)"
        default: "20"
      jobs:
        description: "Conversations at once, per machine"
        default: "3"
      flows:
        description: "Only these flows, comma separated (blank = all)"
        default: ""
      providers:
        description: "Voice engines, comma separated: grok, openai, gemini"
        default: "grok"
      diag:
        description: "1 = print each conversation's voice log (diagnostic run)"
        default: "0"
      spoken:
        description: "1 = the officer's lines are spoken into the microphone (engine speech recognition in the loop); 0 = typed"
        default: "0"
      noise:
        description: "Spoken runs: car-like noise level under the voice (0 = quiet, 0.1 = a car at speed)"
        default: "0"
      turn:
        description: "Turn-detection settings to try, as JSON (blank = the app's defaults), e.g. {\"threshold\":0.7,\"silence_duration_ms\":600}"
        default: ""
      mic_hp:
        description: "High-pass filter on the mic in Hz (0 = none), e.g. 120 to cut car rumble"
        default: "0"
      faults:
        description: "Cellular drops and quiet mics at Patient Pat's rates times this (0 = none, 1 = the driveway: a drop every 40 turns, a third of them dead spots of 10-70 s, a quiet mic every 40 turns)"
        default: "0"
      soundless:
        description: "Share of Ara's replies that reach the app as words with no sound while a scripted line is pending (half that for her other replies); on half of them the sound comes 4-20 s later (Carverhill's 12:45 PM call, Oct 30). 0 = none"
        default: "0"
      drop_after_save:
        description: "Share of saves followed 2.5-5.5 s later by a drop, so Ara has to say where we were (Carverhill's 10:36 AM call, Oct 30). 0 = none"
        default: "0"
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
      runs: ${{ steps.list.outputs.runs }}
    steps:
      - id: list
        env: { PROVIDERS: "${{ inputs.providers }}", MACHINES: "${{ inputs.machines }}", CONVS: "${{ inputs.max_conversations }}", BUDGET: "${{ inputs.budget }}" }
        run: |
          node -e '
            const ps = process.env.PROVIDERS.split(",").map(s => s.trim()).filter(Boolean), convs = Math.max(1, Number(process.env.CONVS) || 5);
            const m = Math.max(1, Math.min(20, Number(process.env.MACHINES) || 20, convs)), budget = Number(process.env.BUDGET) || 0.5, runs = [];
            ps.forEach(provider => { for (let i = 0; i < m; i++) runs.push({ provider, shard: i, convs: Math.floor(convs / m) + (i < convs % m ? 1 : 0), budget: Math.round(budget / m * 10000) / 10000 }); });
            console.log("list=" + JSON.stringify(ps)); console.log("runs=" + JSON.stringify(runs));' >> "$GITHUB_OUTPUT"
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.runs) }}
    name: ${{ matrix.provider }} ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 } # 22: the officer voice uses the built-in WebSocket
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - if: inputs.spoken == '1'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg # mixes each recorded conversation into an mp3
      - uses: actions/cache@v4
        if: inputs.spoken == '1'
        with:
          path: tests/ara-consistency/voices
          key: officer-voices-${{ hashFiles('tests/ara-consistency/flows.js', 'tests/ara-consistency/officer-voice.js') }}
      - name: Talk to ${{ matrix.provider }}
        env:
          ARA_CONSISTENCY_KEY: ${{ secrets.ARA_CONSISTENCY_KEY }}
          OPENAI_CONSISTENCY_KEY: ${{ secrets.OPENAI_CONSISTENCY_KEY }}
          GEMINI_CONSISTENCY_KEY: ${{ secrets.GEMINI_CONSISTENCY_KEY }}
          PROVIDER: ${{ matrix.provider }}
          BUDGET: ${{ matrix.budget }}
          MAX_CONVS: ${{ matrix.convs }}
          SHARD: ${{ matrix.shard }}
          JOBS: ${{ inputs.jobs }}
          FLOWS: ${{ inputs.flows }}
          DIAG: ${{ inputs.diag }}
          SPOKEN: ${{ inputs.spoken }}
          NOISE: ${{ inputs.noise }}
          TURN: ${{ inputs.turn }}
          MIC_HP: ${{ inputs.mic_hp }}
          FAULTS: ${{ inputs.faults }}
          SOUNDLESS: ${{ inputs.soundless }}
          DROP_AFTER_SAVE: ${{ inputs.drop_after_save }}
        run: node tests/ara-consistency/run.js
      - uses: actions/upload-artifact@v4 # spoken runs: the sound clips on their own (one conversation per flow, officer + Ara + noise, with transcripts), to download from the run page and listen to
        if: always() && inputs.spoken == '1'
        with:
          name: spoken-clips-${{ matrix.provider }}-${{ matrix.shard }}
          path: tests/ara-consistency/results/clips/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ara-consistency-results-${{ matrix.provider }}-${{ matrix.shard }}
          path: |
            tests/ara-consistency/results/
            !tests/ara-consistency/results/voices/
  combine:
    needs: [plan, run]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(needs.plan.outputs.list) }}
    name: combine ${{ matrix.provider }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { path: all, pattern: "ara-consistency-results-${{ matrix.provider }}-*" }
      - name: One report for all machines (in the log too, since artifacts can't be fetched from the cloud session)
        env: { PROVIDER: "${{ matrix.provider }}", COMBINE: all, SOUNDLESS: "${{ inputs.soundless }}", FAULTS: "${{ inputs.faults }}", DROP_AFTER_SAVE: "${{ inputs.drop_after_save }}", SPOKEN: "${{ inputs.spoken }}", NOISE: "${{ inputs.noise }}" }
        run: node tests/ara-consistency/run.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ara-consistency-combined-${{ matrix.provider }}
          path: tests/ara-consistency/results/combined.md
